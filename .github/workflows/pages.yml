# MankoMIX GitHub Pages demo deployment.
#
# Builds the GUI in demo mode (in-browser mock backend; see gui/vite.config.ts:
# `--mode demo` makes the mock the default backend, and the relative base
# "./" keeps asset paths working under the /MankoMIX/ sub-path), then
# publishes gui/dist as a Pages site through the official Actions flow.
#
# Build only: nothing here reads git history, so the default shallow
# checkout is fine (unlike the python CI job, which needs full history).

name: Pages

on:
  push:
    branches: [main]
    paths:
      - "gui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GUI demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install (lockfile only)
        working-directory: gui
        run: npm ci

      - name: Build (Pages demo, mock backend)
        working-directory: gui
        run: npm run build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: gui/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
